[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "statagraph"
version = "0.2.2"
description = "Research-aware Stata code, experiment history, and microdata database metadata graph"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "gaolingxi" }]
dependencies = []

[project.scripts]
statagraph = "statagraph.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
